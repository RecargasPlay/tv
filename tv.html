<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBots Pro - MAC Style</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --mac-bg: #0a0a0a; --mac-sidebar: #121212; --mac-accent: #ffcc00; --mac-card: #1c1c1c; --text: #ffffff; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--mac-bg); color: var(--text); overflow: hidden; }
        
        /* LOGIN */
        #login-screen { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; }
        .login-box { background: #181818; padding: 40px; border-radius: 15px; border: 1px solid #333; width: 320px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 0 30px rgba(255,204,0,0.1); }
        input { padding: 12px; border-radius: 5px; border: 1px solid #444; background: #050505; color: #fff; outline: none; }
        input:focus { border-color: var(--mac-accent); }
        button { padding: 12px; background: var(--mac-accent); color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #e6b800; transform: scale(1.02); }

        /* APP LAYOUT */
        #app { display: none; height: 100vh; grid-template-columns: 260px 1fr; }
        .sidebar { background: var(--mac-sidebar); padding: 25px; border-right: 1px solid #222; display: flex; flex-direction: column; }
        .sidebar h2 { color: var(--mac-accent); font-size: 1.3rem; margin-bottom: 40px; text-align: center; }
        .menu-item { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 8px; color: #888; transition: 0.2s; font-weight: 500; }
        .menu-item:hover, .menu-item.active { background: #222; color: var(--mac-accent); border-left: 4px solid var(--mac-accent); }

        .content { padding: 35px; overflow-y: auto; height: 100vh; scroll-behavior: smooth; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 25px; }
        
        /* CARDS */
        .card { background: var(--mac-card); border-radius: 12px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: 0.3s; position: relative; }
        .card:hover { border-color: var(--mac-accent); transform: translateY(-8px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 230px; object-fit: cover; background: #222; }
        .card-info { padding: 10px; background: rgba(0,0,0,0.8); position: absolute; bottom: 0; width: 100%; box-sizing: border-box; }
        .card p { font-size: 13px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* MODAIS */
        #player-modal, #series-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; }
        #series-modal { background: rgba(0,0,0,0.96); padding: 60px; overflow-y: auto; }
        video { width: 100%; height: 100%; }
        .close { position: absolute; top: 25px; right: 35px; font-size: 45px; color: #fff; cursor: pointer; z-index: 10001; text-shadow: 0 0 10px #000; }
        
        /* LISTA EPISODIOS */
        .ep-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; list-style: none; padding: 0; margin-top: 20px; }
        .ep-item { background: #1a1a1a; padding: 18px; border-radius: 8px; cursor: pointer; border: 1px solid #333; transition: 0.2s; }
        .ep-item:hover { background: var(--mac-accent); color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="color: var(--mac-accent); letter-spacing: 2px;">WEB BOTS <span style="font-weight: 200;">PRO</span></h1>
        <div class="login-box">
            <input type="text" id="dns" value="http://auth.urltech.gy:8080" placeholder="DNS do Servidor">
            <input type="text" id="user" placeholder="Seu Usuário">
            <input type="password" id="pass" placeholder="Sua Senha">
            <button onclick="logar()">ENTRAR NO SISTEMA</button>
            <p style="font-size: 11px; color: #555; text-align: center; line-height: 1.4;">
                Se falhar, ative o acesso em:<br>
                <a href="https://cors-anywhere.com/corsdemo" target="_blank" style="color: #888;">cors-anywhere.com/corsdemo</a>
            </p>
        </div>
    </div>

    <div id="app">
        <aside class="sidebar">
            <h2>MAC MENU</h2>
            <div id="m-live" class="menu-item active" onclick="mudarAba('live', this)">TV AO VIVO</div>
            <div id="m-vod" class="menu-item" onclick="mudarAba('vod', this)">FILMES</div>
            <div id="m-series" class="menu-item" onclick="mudarAba('series', this)">SÉRIES</div>
            <div style="margin-top: auto;"></div>
            <div class="menu-item" onclick="location.reload()" style="color: #ff4444; border: none;">SAIR</div>
        </aside>
        <main class="content">
            <h3 id="label-aba" style="color: #555; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px;">TV AO VIVO</h3>
            <div class="grid" id="container-grid"></div>
        </main>
    </div>

    <div id="series-modal">
        <span class="close" onclick="fecharModais()">&times;</span>
        <h2 id="nome-da-serie" style="color: var(--mac-accent); margin-bottom: 10px;">Temporadas</h2>
        <div id="box-episodios" class="ep-list"></div>
    </div>

    <div id="player-modal">
        <span class="close" onclick="fecharModais()">&times;</span>
        <video id="video-main" controls autoplay></video>
    </div>

    <script>
        let conta = {};
        let db = { live: [], vod: [], series: [] };
        
        // Proxy para permitir que o GitHub (HTTPS) acesse o servidor (HTTP)
        const PROXY = "https://cors-anywhere.com/";

        async function logar() {
            const dns = document.getElementById('dns').value.trim().replace(/\/$/, "");
            const user = document.getElementById('user').value.trim();
            const pass = document.getElementById('pass').value.trim();

            if(!dns || !user || !pass) return alert("Por favor, preencha todos os campos.");

            const linkAuth = `${PROXY}${dns}/player_api.php?username=${user}&password=${pass}`;

            try {
                const res = await fetch(linkAuth);
                const json = await res.json();

                if (json.user_info && json.user_info.auth === 1) {
                    conta = { dns, user, pass };
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app').style.display = 'grid';
                    await carregarDadosIniciais();
                } else {
                    alert("Usuário ou senha incorretos.");
                }
            } catch (err) {
                alert("Erro de conexão! Clique no link abaixo do botão de entrar para autorizar o Proxy.");
            }
        }

        async function carregarDadosIniciais() {
            const { dns, user, pass } = conta;
            const api = `${PROXY}${dns}/player_api.php?username=${user}&password=${pass}`;

            try {
                const [live, vod, series] = await Promise.all([
                    fetch(`${api}&action=get_live_streams`).then(r => r.json()),
                    fetch(`${api}&action=get_vod_streams`).then(r => r.json()),
                    fetch(`${api}&action=get_series`).then(r => r.json())
                ]);

                db.live = Array.isArray(live) ? live : [];
                db.vod = Array.isArray(vod) ? vod : [];
                db.series = Array.isArray(series) ? series : [];

                desenharGrid('live');
            } catch (e) { console.error("Falha ao carregar conteúdo"); }
        }

        function mudarAba(tipo, elemento) {
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            elemento.classList.add('active');
            document.getElementById('label-aba').innerText = elemento.innerText;
            desenharGrid(tipo);
        }

        function desenharGrid(tipo) {
            const grid = document.getElementById('container-grid');
            grid.innerHTML = "";
            const lista = db[tipo] || [];

            // Limitamos a 200 itens para não pesar o navegador
            lista.slice(0, 200).forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const img = item.stream_icon || item.cover || 'https://via.placeholder.com/200x300?text=Sem+Imagem';
                
                card.innerHTML = `<img src="${img}" loading="lazy"><div class="card-info"><p>${item.name}</p></div>`;
                
                card.onclick = () => {
                    if (tipo === 'series') {
                        verSeries(item.series_id, item.name);
                    } else {
                        const pasta = (tipo === 'live') ? 'live' : 'movie';
                        const ext = item.container_extension || (tipo === 'live' ? 'ts' : 'mp4');
                        const urlCanal = `${conta.dns}/${pasta}/${conta.user}/${conta.pass}/${item.stream_id}.${ext}`;
                        abrirVideo(urlCanal);
                    }
                };
                grid.appendChild(card);
            });
        }

        async function verSeries(id, nome) {
            const urlInfo = `${PROXY}${conta.dns}/player_api.php?username=${conta.user}&password=${conta.pass}&action=get_series_info&series_id=${id}`;
            const res = await fetch(urlInfo);
            const dados = await res.json();
            
            document.getElementById('nome-da-serie').innerText = nome;
            const container = document.getElementById('box-episodios');
            container.innerHTML = "";

            // O Xtream Codes retorna episódios por temporadas (key 'episodes')
            if (dados.episodes) {
                for (let s in dados.episodes) {
                    dados.episodes[s].forEach(ep => {
                        const item = document.createElement('div');
                        item.className = 'ep-item';
                        item.innerText = `Temporada ${s} | EP ${ep.episode_num} - ${ep.title}`;
                        item.onclick = () => {
                            const urlEp = `${conta.dns}/series/${conta.user}/${conta.pass}/${ep.id}.${ep.container_extension}`;
                            abrirVideo(urlEp);
                        };
                        container.appendChild(item);
                    });
                }
            }
            document.getElementById('series-modal').style.display = 'block';
        }

        function abrirVideo(url) {
            const modal = document.getElementById('player-modal');
            const video = document.getElementById('video-main');
            modal.style.display = 'block';

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.ERROR, function(e, data) {
                    if(data.fatal) hls.loadSource(PROXY + url); // Tenta via proxy se falhar direto
                });
            } else {
                video.src = url;
            }
        }

        function fecharModais() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('series-modal').style.display = 'none';
            const v = document.getElementById('video-main');
            v.pause();
            v.src = "";
        }
    </script>
</body>
</html>
