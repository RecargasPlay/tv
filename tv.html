<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBots Pro - MAC Style</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --mac-bg: #0a0a0a; --mac-sidebar: #121212; --mac-accent: #ffcc00; --mac-card: #1c1c1c; --text: #ffffff; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--mac-bg); color: var(--text); overflow: hidden; }
        
        /* LOGIN */
        #login-screen { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; }
        .login-box { background: #181818; padding: 40px; border-radius: 15px; border: 1px solid #333; width: 320px; display: flex; flex-direction: column; gap: 15px; }
        input { padding: 12px; border-radius: 5px; border: 1px solid #444; background: #050505; color: #fff; }
        button { padding: 12px; background: var(--mac-accent); color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }

        /* LAYOUT */
        #app { display: none; height: 100vh; grid-template-columns: 250px 1fr; }
        .sidebar { background: var(--mac-sidebar); padding: 20px; border-right: 1px solid #222; }
        .menu-item { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; color: #888; transition: 0.2s; }
        .menu-item:hover, .menu-item.active { background: #222; color: var(--mac-accent); }

        .content { padding: 30px; overflow-y: auto; height: 100vh; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        
        /* CARDS */
        .card { background: var(--mac-card); border-radius: 10px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .card:hover { border-color: var(--mac-accent); transform: translateY(-5px); }
        .card img { width: 100%; height: 210px; object-fit: cover; }
        .card p { font-size: 13px; padding: 10px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* MODAIS */
        #player-modal, #series-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; }
        #series-modal { background: rgba(0,0,0,0.9); padding: 50px; overflow-y: auto; }
        video { width: 100%; height: 100%; }
        .close { position: absolute; top: 20px; right: 20px; font-size: 40px; color: #fff; cursor: pointer; z-index: 10001; }
        .ep-item { background: #222; padding: 15px; margin: 5px 0; border-radius: 5px; cursor: pointer; }
        .ep-item:hover { background: var(--mac-accent); color: #000; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2 style="color: var(--mac-accent);">WEB BOTS PRO</h2>
        <div class="login-box">
            <input type="text" id="dns" value="http://auth.urltech.gy:8080" placeholder="DNS">
            <input type="text" id="user" placeholder="Usuário">
            <input type="password" id="pass" placeholder="Senha">
            <button onclick="fazerLogin()">ACESSAR PAINEL</button>
            <p style="font-size: 10px; color: #666; text-align: center;">Lembre-se de ativar o CORS no site herokuapp primeiro.</p>
        </div>
    </div>

    <div id="app">
        <aside class="sidebar">
            <h3>MAC MENU</h3>
            <div class="menu-item active" onclick="trocarAbas('live', this)">TV AO VIVO</div>
            <div class="menu-item" onclick="trocarAbas('vod', this)">FILMES</div>
            <div class="menu-item" onclick="trocarAbas('series', this)">SÉRIES</div>
            <div class="menu-item" onclick="location.reload()" style="margin-top:50px; color: red;">SAIR</div>
        </aside>
        <main class="content">
            <div class="grid" id="grid-principal"></div>
        </main>
    </div>

    <div id="series-modal">
        <span class="close" onclick="fecharModais()">&times;</span>
        <h2 id="series-title" style="color:var(--mac-accent)"></h2>
        <div id="lista-episodios"></div>
    </div>

    <div id="player-modal">
        <span class="close" onclick="fecharModais()">&times;</span>
        <video id="video-player" controls autoplay></video>
    </div>

    <script>
        let credenciais = {};
        let dadosRaw = { live: [], vod: [], series: [] };
        // PROXY NECESSÁRIO PARA GITHUB (HTTP -> HTTPS)
        const PROXY = "https://cors-anywhere.herokuapp.com/";

        async function fazerLogin() {
            const dns = document.getElementById('dns').value.replace(/\/$/, "");
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;

            const urlAuth = `${PROXY}${dns}/player_api.php?username=${user}&password=${pass}`;

            try {
                const res = await fetch(urlAuth);
                const data = await res.json();

                if(data.user_info && data.user_info.auth === 1) {
                    credenciais = { dns, user, pass };
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app').style.display = 'grid';
                    await carregarTudo();
                } else {
                    alert("Dados Inválidos!");
                }
            } catch(e) {
                alert("Erro de Conexão! Verifique se ativou o acesso ao Proxy CORS.");
            }
        }

        async function carregarTudo() {
            const { dns, user, pass } = credenciais;
            const base = `${PROXY}${dns}/player_api.php?username=${user}&password=${pass}`;

            // Busca as 3 listas simultaneamente
            const [l, v, s] = await Promise.all([
                fetch(`${base}&action=get_live_streams`).then(r => r.json()),
                fetch(`${base}&action=get_vod_streams`).then(r => r.json()),
                fetch(`${base}&action=get_series`).then(r => r.json())
            ]);

            dadosRaw.live = l;
            dadosRaw.vod = v;
            dadosRaw.series = s;
            renderizar('live');
        }

        function trocarAbas(tipo, el) {
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            el.classList.add('active');
            renderizar(tipo);
        }

        function renderizar(tipo) {
            const grid = document.getElementById('grid-principal');
            grid.innerHTML = "";
            const lista = dadosRaw[tipo] || [];

            lista.slice(0, 300).forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const thumb = item.stream_icon || item.cover || 'https://via.placeholder.com/150x210?text=Sem+Foto';
                
                card.innerHTML = `<img src="${thumb}"><p>${item.name}</p>`;
                
                card.onclick = () => {
                    if(tipo === 'series') {
                        abrirSeries(item.series_id, item.name);
                    } else {
                        const pasta = tipo === 'live' ? 'live' : 'movie';
                        const ext = item.container_extension || (tipo === 'live' ? 'ts' : 'mp4');
                        const urlFinal = `${credenciais.dns}/${pasta}/${credenciais.user}/${credenciais.pass}/${item.stream_id}.${ext}`;
                        iniciarPlayer(urlFinal);
                    }
                };
                grid.appendChild(card);
            });
        }

        async function abrirSeries(id, nome) {
            const url = `${PROXY}${credenciais.dns}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}&action=get_series_info&series_id=${id}`;
            const res = await fetch(url);
            const data = await res.json();
            
            document.getElementById('series-title').innerText = nome;
            const listaEp = document.getElementById('lista-episodios');
            listaEp.innerHTML = "";

            for(let s in data.episodes) {
                data.episodes[s].forEach(ep => {
                    const d = document.createElement('div');
                    d.className = 'ep-item';
                    d.innerText = `Temp ${s} - Ep ${ep.episode_num}: ${ep.title}`;
                    d.onclick = () => {
                        const urlEp = `${credenciais.dns}/series/${credenciais.user}/${credenciais.pass}/${ep.id}.${ep.container_extension}`;
                        iniciarPlayer(urlEp);
                    };
                    listaEp.appendChild(d);
                });
            }
            document.getElementById('series-modal').style.display = 'block';
        }

        function iniciarPlayer(url) {
            const modal = document.getElementById('player-modal');
            const video = document.getElementById('video-player');
            modal.style.display = 'block';

            if(Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else {
                video.src = url;
            }
        }

        function fecharModais() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('series-modal').style.display = 'none';
            const v = document.getElementById('video-player');
            v.pause(); v.src = "";
        }
    </script>
</body>
</html>
