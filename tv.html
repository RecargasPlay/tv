<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBots Pro - MAC Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --mac-bg: #0a0a0a; --mac-sidebar: #121212; --mac-accent: #ffcc00; --mac-card: #1c1c1c; --text: #ffffff; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--mac-bg); color: var(--text); overflow: hidden; }
        
        /* LOGIN */
        #login-screen { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; }
        .login-box { background: #181818; padding: 40px; border-radius: 15px; border: 1px solid #333; width: 320px; display: flex; flex-direction: column; gap: 15px; }
        input { padding: 12px; border-radius: 5px; border: 1px solid #444; background: #000; color: #fff; outline: none; }
        button { padding: 12px; background: var(--mac-accent); color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }

        /* APP */
        #app { display: none; height: 100vh; grid-template-columns: 260px 1fr; }
        .sidebar { background: var(--mac-sidebar); padding: 25px; border-right: 1px solid #222; }
        .menu-item { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 8px; color: #888; transition: 0.2s; }
        .menu-item.active, .menu-item:hover { background: #222; color: var(--mac-accent); }

        .content { padding: 30px; overflow-y: auto; height: 100vh; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        
        .card { background: var(--mac-card); border-radius: 10px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: 0.3s; position: relative; }
        .card:hover { border-color: var(--mac-accent); transform: translateY(-5px); }
        .card img { width: 100%; height: 230px; object-fit: cover; }
        .card-info { padding: 10px; background: rgba(0,0,0,0.8); position: absolute; bottom: 0; width: 100%; }
        .card p { font-size: 13px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* MODAIS */
        #player-modal, #series-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; }
        #series-modal { padding: 50px; overflow-y: auto; background: rgba(0,0,0,0.95); }
        video { width: 100%; height: 100%; }
        .close { position: absolute; top: 20px; right: 30px; font-size: 40px; color: #fff; cursor: pointer; }
        .ep-item { background: #222; padding: 15px; margin: 5px 0; border-radius: 5px; cursor: pointer; border: 1px solid #333; }
        .ep-item:hover { background: var(--mac-accent); color: #000; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="color: var(--mac-accent);">WEB BOTS PRO</h1>
        <div class="login-box">
            <input type="text" id="dns" value="http://auth.urltech.gy:8080" placeholder="Servidor">
            <input type="text" id="user" placeholder="Usuário">
            <input type="password" id="pass" placeholder="Senha">
            <button onclick="logar()">ENTRAR</button>
        </div>
    </div>

    <div id="app">
        <aside class="sidebar">
            <h2 style="color: var(--mac-accent); text-align:center;">MAC MENU</h2>
            <div class="menu-item active" onclick="aba('live', this)">TV AO VIVO</div>
            <div class="menu-item" onclick="aba('vod', this)">FILMES</div>
            <div class="menu-item" onclick="aba('series', this)">SÉRIES</div>
            <div class="menu-item" onclick="location.reload()" style="color:red; margin-top:30px;">SAIR</div>
        </aside>
        <main class="content">
            <div class="grid" id="grid"></div>
        </main>
    </div>

    <div id="series-modal">
        <span class="close" onclick="fechar()">&times;</span>
        <h2 id="s-title" style="color:var(--mac-accent)"></h2>
        <div id="ep-list"></div>
    </div>

    <div id="player-modal">
        <span class="close" onclick="fechar()">&times;</span>
        <video id="vid" controls autoplay></video>
    </div>

    <script>
        let auth = {};
        let data = { live: [], vod: [], series: [] };
        
        // ESTE PROXY É AUTOMÁTICO E NÃO PRECISA DE ATIVAÇÃO MANUAL
        const PROXY = "https://corsproxy.io/?";

        async function logar() {
            const dns = document.getElementById('dns').value.replace(/\/$/, "");
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;

            // Monta a URL passando pelo proxy automático
            const url = `${PROXY}${encodeURIComponent(dns + '/player_api.php?username=' + user + '&password=' + pass)}`;

            try {
                const res = await fetch(url);
                const json = await res.json();

                if (json.user_info && json.user_info.auth === 1) {
                    auth = { dns, user, pass };
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app').style.display = 'grid';
                    await carregar();
                } else {
                    alert("Dados incorretos!");
                }
            } catch (e) {
                alert("Erro ao conectar no servidor de IPTV.");
            }
        }

        async function carregar() {
            const api = (act) => `${PROXY}${encodeURIComponent(auth.dns + '/player_api.php?username=' + auth.user + '&password=' + auth.pass + '&action=' + act)}`;

            const [l, v, s] = await Promise.all([
                fetch(api('get_live_streams')).then(r => r.json()),
                fetch(api('get_vod_streams')).then(r => r.json()),
                fetch(api('get_series')).then(r => r.json())
            ]);

            data.live = l; data.vod = v; data.series = s;
            render('live');
        }

        function aba(t, el) {
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            el.classList.add('active');
            render(t);
        }

        function render(t) {
            const g = document.getElementById('grid');
            g.innerHTML = "";
            (data[t] || []).slice(0, 200).forEach(i => {
                const card = document.createElement('div');
                card.className = 'card';
                const img = i.stream_icon || i.cover || 'https://via.placeholder.com/200x300';
                card.innerHTML = `<img src="${img}"><div class="card-info"><p>${i.name}</p></div>`;
                
                card.onclick = () => {
                    if(t === 'series') {
                        verSeries(i.series_id, i.name);
                    } else {
                        const pasta = t === 'live' ? 'live' : 'movie';
                        const ext = i.container_extension || (t === 'live' ? 'ts' : 'mp4');
                        play(`${auth.dns}/${pasta}/${auth.user}/${auth.pass}/${i.stream_id}.${ext}`);
                    }
                };
                g.appendChild(card);
            });
        }

        async function verSeries(id, nome) {
            const url = `${PROXY}${encodeURIComponent(auth.dns + '/player_api.php?username=' + auth.user + '&password=' + auth.pass + '&action=get_series_info&series_id=' + id)}`;
            const res = await fetch(url);
            const d = await res.json();
            
            document.getElementById('s-title').innerText = nome;
            const list = document.getElementById('ep-list');
            list.innerHTML = "";

            for(let s in d.episodes) {
                d.episodes[s].forEach(ep => {
                    const item = document.createElement('div');
                    item.className = 'ep-item';
                    item.innerText = `T${s} - E${ep.episode_num}: ${ep.title}`;
                    item.onclick = () => play(`${auth.dns}/series/${auth.user}/${auth.pass}/${ep.id}.${ep.container_extension}`);
                    list.appendChild(item);
                });
            }
            document.getElementById('series-modal').style.display = 'block';
        }

        function play(url) {
            const modal = document.getElementById('player-modal');
            const v = document.getElementById('vid');
            modal.style.display = 'block';

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(v);
            } else { v.src = url; }
        }

        function fechar() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('series-modal').style.display = 'none';
            const v = document.getElementById('vid');
            v.pause(); v.src = "";
        }
    </script>
</body>
</html>
